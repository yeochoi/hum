<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap">
<div style="font-family:var(--font-sans);color:var(--ink);background:var(--bg);padding:16px;max-width:358px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px">
<button type="button" style="height:54px;border:0;border-radius:999px;background:var(--primary);color:#fff;font:600 17px var(--font-sans)">Save</button>
<button type="button" style="height:54px;border:0;border-radius:999px;background:var(--soft);color:var(--blue-text);font:600 17px var(--font-sans)">New playlist</button>
<div style="background:var(--hero);padding:14px;border-radius:16px;display:flex;gap:12px"><button type="button" style="flex:1;height:48px;border:0;border-radius:999px;background:var(--primary);color:#fff;font:600 17px var(--font-sans)">Play</button><button type="button" style="flex:1;height:48px;border:0;border-radius:999px;background:rgba(255,255,255,.1);color:#fff;font:600 17px var(--font-sans)">Shuffle</button></div>
<button type="button" style="border:0;background:none;color:var(--coral-text);font:400 17px var(--font-sans);padding:8px">Remove from library</button>
</div>
